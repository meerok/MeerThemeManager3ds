  <style>:root {
  --bg: #0d0e1d;
  --bg2: #12132a;
  --panel: #171936;
  --card: #1c1f40;
  --card2: #23264d;
  --border: #2c2f5c;
  --border2: #3a3e74;
  --text: #eceeff;
  --text2: #a2a7d4;
  --text3: #6f74a6;
  --accent: #5b7cff;
  --accent2: #7ab6ff;
  --accentSoft: rgba(91, 124, 255, 0.16);
  --good: #3ddc97;
  --warn: #ffb547;
  --bad: #ff5d73;
  --radius: 12px;
  --font: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Inter", "Noto Sans", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.4 var(--font); overflow: hidden; user-select: none; }
input, select, textarea, button { font: inherit; color: inherit; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: #2a2d58; border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-track { background: transparent; }

/* ───── App frame ───── */
#app { display: grid; grid-template-rows: 54px 1fr; height: 100vh; }
#topbar { display: flex; align-items: center; gap: 12px; padding: 0 14px; background: linear-gradient(180deg, #15173a, #111231); border-bottom: 1px solid var(--border); }
#topbar .brand { display: flex; align-items: center; gap: 10px; min-width: 226px; }
#topbar .brand img { width: 34px; height: 34px; border-radius: 9px; box-shadow: 0 2px 10px rgba(91,124,255,.35); }
#topbar .brand b { font-size: 16px; letter-spacing: .2px; }
#topbar .brand small { display: block; color: var(--text2); font-size: 11px; margin-top: -2px; }
#topbar .doc { flex: 1; display: flex; align-items: center; gap: 8px; color: var(--text2); }
#topbar .doc b { color: var(--text); font-weight: 600; }
#topbar .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--warn); display: none; }
#topbar .dot.on { display: inline-block; }
#topbar .actions { display: flex; gap: 6px; }

#main { display: grid; grid-template-columns: 236px minmax(470px, 1fr) minmax(430px, 0.95fr); min-height: 0; }

/* ───── Sidebar ───── */
#sidebar { background: var(--bg2); border-right: 1px solid var(--border); overflow-y: auto; padding: 10px 10px 16px; display: flex; flex-direction: column; }
.nav-group { margin-top: 10px; }
.nav-group h6 { margin: 8px 10px 4px; font-size: 10.5px; text-transform: uppercase; letter-spacing: 1px; color: var(--text3); font-weight: 700; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 9px; color: var(--text2); cursor: pointer; transition: background .12s, color .12s; position: relative; }
.nav-item:hover { background: rgba(255,255,255,.04); color: var(--text); }
.nav-item.active { background: linear-gradient(90deg, rgba(91,124,255,.28), rgba(91,124,255,.08)); color: #fff; }
.nav-item.active::before { content: ''; position: absolute; left: -10px; top: 8px; bottom: 8px; width: 3px; border-radius: 3px; background: var(--accent2); }
.nav-item svg { width: 18px; height: 18px; flex: none; }
.nav-item .badge { margin-left: auto; width: 7px; height: 7px; border-radius: 50%; background: var(--accent2); box-shadow: 0 0 8px var(--accent2); }
.sidebar-foot { margin-top: auto; padding: 12px 8px 0; display: flex; gap: 10px; align-items: center; border-top: 1px solid var(--border); }
.sidebar-foot canvas { width: 34px; height: 34px; border-radius: 8px; image-rendering: pixelated; }
.sidebar-foot b { display: block; font-size: 13px; }
.sidebar-foot span { color: var(--text3); font-size: 12px; }

/* ───── Editor ───── */
#editor { overflow-y: auto; padding: 22px 26px 60px; min-width: 0; }
.page { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.page-head { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 4px; }
.page-head .ico { width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; background: linear-gradient(160deg, var(--accent), #3a4fd8); box-shadow: 0 6px 18px rgba(91,124,255,.35); flex: none; }
.page-head .ico svg { width: 24px; height: 24px; color: #fff; }
.page-head h1 { margin: 0 0 3px; font-size: 22px; letter-spacing: .2px; }
.page-head p { margin: 0; color: var(--text2); }

.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.card-head { display: flex; align-items: center; gap: 10px; }
.card-head svg { width: 18px; height: 18px; color: var(--accent2); flex: none; }
.card-head .t { flex: 1; min-width: 0; }
.card-head b { display: block; font-size: 14.5px; }
.card-head small { display: block; color: var(--text2); font-size: 12px; }
.card .off { color: var(--text3); font-size: 13px; }
.divider { height: 1px; background: var(--border); margin: 2px 0; }
.row { display: flex; align-items: center; gap: 10px; }
.row.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.muted { color: var(--text2); }
.small { font-size: 12px; }
.cols2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

/* Buttons */
.btn { display: inline-flex; align-items: center; gap: 7px; padding: 7px 13px; border-radius: 9px; border: 1px solid var(--border2); background: var(--card2); cursor: pointer; white-space: nowrap; transition: background .12s, border-color .12s, transform .05s; font-size: 13px; }
.btn:hover { background: #2b2f5e; border-color: #4a4f90; }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: default; }
.btn svg { width: 15px; height: 15px; }
.btn.primary { background: linear-gradient(180deg, #6684ff, #4a63ea); border-color: #6b85ff; color: #fff; box-shadow: 0 4px 14px rgba(91,124,255,.35); }
.btn.primary:hover { background: linear-gradient(180deg, #7591ff, #556ef0); }
.btn.danger { color: #ff8a9a; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--text2); }
.btn.ghost:hover { background: rgba(255,255,255,.06); color: var(--text); }
.btn.icon { padding: 7px; }
.btn.small { padding: 5px 10px; font-size: 12px; }

/* Toggle switch */
.switch { position: relative; width: 40px; height: 23px; flex: none; cursor: pointer; }
.switch input { display: none; }
.switch span { position: absolute; inset: 0; background: #2f3263; border-radius: 20px; transition: background .15s; }
.switch span::after { content: ''; position: absolute; width: 17px; height: 17px; top: 3px; left: 3px; background: #fff; border-radius: 50%; transition: transform .15s; box-shadow: 0 1px 3px rgba(0,0,0,.4); }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(17px); }

/* Inputs */
.field label { display: flex; justify-content: space-between; font-weight: 600; font-size: 13px; margin-bottom: 5px; }
.field label span { color: var(--text3); font-weight: 400; }
.field small { display: block; color: var(--text3); font-size: 12px; margin-top: 4px; }
input[type=text], textarea, select { width: 100%; background: #13152f; border: 1px solid var(--border2); border-radius: 8px; padding: 8px 10px; outline: none; }
input[type=text]:focus, textarea:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accentSoft); }
textarea { resize: vertical; min-height: 60px; }
select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--text2) 50%), linear-gradient(135deg, var(--text2) 50%, transparent 50%); background-position: calc(100% - 16px) 55%, calc(100% - 11px) 55%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 28px; }
input[type=range] { -webkit-appearance: none; width: 100%; height: 22px; background: transparent; }
input[type=range]::-webkit-slider-runnable-track { height: 5px; border-radius: 5px; background: linear-gradient(90deg, var(--accent) var(--p, 50%), #2f3263 var(--p, 50%)); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 17px; height: 17px; border-radius: 50%; background: #fff; margin-top: -6px; box-shadow: 0 1px 4px rgba(0,0,0,.5); cursor: pointer; }

/* Color rows */
.color-row { display: flex; align-items: center; gap: 10px; padding: 5px 8px; border-radius: 8px; transition: background .12s; }
.color-row.drop { background: var(--accentSoft); }
.color-row .lbl { flex: 1; min-width: 0; }
.color-row .lbl small { display: block; color: var(--text3); font-size: 12px; }
.color-row input.hex { width: 92px; font-family: Consolas, "Cascadia Mono", monospace; font-size: 12.5px; text-transform: uppercase; padding: 6px 8px; }
.swatch { width: 44px; height: 28px; border-radius: 7px; border: 1px solid rgba(255,255,255,.25); position: relative; overflow: hidden; cursor: pointer; flex: none; }
.swatch input { position: absolute; inset: -8px; width: 70px; height: 50px; opacity: 0; cursor: pointer; }
.alpha-row { display: flex; align-items: center; gap: 10px; padding: 0 8px 4px; font-size: 12px; color: var(--text3); }
.alpha-row span:last-child { width: 42px; text-align: right; }
.slider-row { padding: 2px 8px; }
.slider-row .top { display: flex; justify-content: space-between; }
.slider-row .top span { color: var(--text2); font-variant-numeric: tabular-nums; cursor: default; }
.slider-row .top span.changed { color: var(--accent2); }
.slider-row small { color: var(--text3); font-size: 12px; }

/* Mode picker */
.modes { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; }
.mode { padding: 12px 6px 10px; border-radius: 10px; background: rgba(255,255,255,.03); border: 1.5px solid transparent; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; color: var(--text2); transition: all .12s; font-size: 12.5px; font-weight: 600; }
.mode svg { width: 22px; height: 22px; }
.mode:hover { background: rgba(255,255,255,.06); color: var(--text); }
.mode.sel { background: var(--accentSoft); border-color: var(--accent); color: #fff; }
.seg { display: flex; background: #13152f; border: 1px solid var(--border2); border-radius: 9px; padding: 3px; gap: 2px; }
.seg button { flex: 1; border: 0; background: transparent; padding: 6px 8px; border-radius: 6px; cursor: pointer; color: var(--text2); font-size: 12.5px; white-space: nowrap; }
.seg button.sel { background: var(--accent); color: #fff; box-shadow: 0 2px 8px rgba(91,124,255,.35); }

/* Image slot */
.slot-head { display: flex; align-items: baseline; gap: 10px; }
.slot-head .t { flex: 1; }
.slot-head b { display: block; }
.slot-head small { color: var(--text2); font-size: 12px; }
.pill { font-size: 11.5px; color: var(--text2); background: rgba(255,255,255,.06); padding: 3px 9px; border-radius: 20px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.thumb { position: relative; border-radius: 9px; border: 1.5px dashed var(--border2); overflow: hidden; display: grid; place-items: center; cursor: pointer; background: repeating-conic-gradient(#1b1d3a 0 25%, #212447 0 50%) 0 0 / 16px 16px; transition: border-color .12s; }
.thumb.has { border-style: solid; }
.thumb.drop { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accentSoft); }
.thumb canvas { max-width: 100%; max-height: 100%; image-rendering: auto; }
.thumb canvas.px { image-rendering: pixelated; }
.thumb .empty { display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--text2); font-size: 13px; text-align: center; padding: 10px; }
.thumb .empty svg { width: 28px; height: 28px; color: var(--text3); }
.thumb .hover { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(10,10,30,.55); opacity: 0; transition: opacity .15s; font-weight: 600; }
.thumb.has:hover .hover { opacity: 1; }

/* Palette */
.palette { display: flex; flex-wrap: wrap; gap: 6px; }
.palette div { width: 26px; height: 26px; border-radius: 7px; border: 1px solid rgba(255,255,255,.2); cursor: grab; transition: transform .1s; }
.palette div:hover { transform: scale(1.12); }

.banner { display: flex; gap: 10px; padding: 12px 14px; border-radius: 10px; background: var(--accentSoft); color: var(--text2); align-items: flex-start; }
.banner svg { width: 18px; height: 18px; color: var(--accent2); flex: none; margin-top: 1px; }
.banner.warn { background: rgba(255,181,71,.1); }
.banner.warn svg { color: var(--warn); }

.meter .top { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 5px; }
.meter .top span { color: var(--text2); font-variant-numeric: tabular-nums; }
.meter .bar { height: 7px; border-radius: 6px; background: #2a2d5a; overflow: hidden; }
.meter .bar div { height: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
.meter.warn .bar div { background: var(--warn); }
.meter.bad .bar div { background: var(--bad); }
.meter.bad .top span { color: var(--bad); }

.check { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; }
.check svg { width: 16px; height: 16px; flex: none; margin-top: 1px; }
.check.ok svg { color: var(--good); } .check.w svg { color: var(--warn); } .check.e svg { color: var(--bad); }

.dropzone { border: 1.5px dashed var(--border2); border-radius: 10px; padding: 12px 14px; display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,.02); transition: all .12s; }
.dropzone.drop { border-color: var(--accent); background: var(--accentSoft); }
.dropzone svg { width: 20px; height: 20px; color: var(--text3); }
.dropzone.has svg { color: var(--accent2); }
.dropzone .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text2); }
.dropzone.has .name { color: var(--text); }

.wave { height: 110px; border-radius: 10px; border: 1.5px dashed var(--border2); display: grid; place-items: center; background: rgba(255,255,255,.02); position: relative; overflow: hidden; }
.wave.has { border-style: solid; }
.wave.drop { border-color: var(--accent); background: var(--accentSoft); }
.wave canvas { position: absolute; inset: 8px; width: calc(100% - 16px); height: calc(100% - 16px); }

.sfx-row { display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: 9px; transition: background .12s; }
.sfx-row.drop { background: var(--accentSoft); }
.sfx-row .ic { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; background: rgba(255,255,255,.05); color: var(--text3); flex: none; }
.sfx-row.has .ic { background: var(--accentSoft); color: var(--accent2); }
.sfx-row .ic svg { width: 17px; height: 17px; }

.big-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.big { display: flex; gap: 12px; align-items: center; padding: 16px; border-radius: 12px; border: 0; cursor: pointer; color: #fff; text-align: left; background: linear-gradient(160deg, #6684ff, #3f55d8); box-shadow: 0 8px 22px rgba(91,124,255,.3); transition: transform .1s, filter .1s; }
.big:hover { filter: brightness(1.08); transform: translateY(-1px); }
.big svg { width: 26px; height: 26px; flex: none; }
.big b { display: block; font-size: 15px; } .big small { opacity: .85; font-size: 12px; }
.steps { display: flex; flex-direction: column; gap: 8px; }
.step { display: flex; gap: 10px; align-items: flex-start; }
.step i { font-style: normal; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; font-size: 12px; font-weight: 700; flex: none; }
.files .f { display: flex; gap: 8px; align-items: center; font-size: 13px; padding: 2px 0; }
.files code { font-family: Consolas, "Cascadia Mono", monospace; }
.files svg { width: 15px; height: 15px; }
.files .yes svg { color: var(--good); } .files .no { opacity: .5; }

/* ───── Preview pane ───── */
#preview { background: radial-gradient(ellipse at 50% 0%, #1f2250 0%, #0f1024 70%); border-left: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; min-width: 0; overflow: hidden; }
#preview .label { position: absolute; top: 14px; left: 18px; font-size: 11px; color: var(--text3); letter-spacing: 1px; text-transform: uppercase; font-weight: 700; }
.console { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.bezel { padding: 9px; border-radius: 14px; background: #121318; box-shadow: 0 16px 40px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.06); }
.bezel canvas { display: block; border-radius: 3px; }
.pcontrols { position: absolute; bottom: 16px; display: flex; gap: 8px; align-items: center; background: rgba(20,22,48,.8); backdrop-filter: blur(10px); border: 1px solid var(--border); padding: 6px; border-radius: 30px; }
.pcontrols .seg { border-radius: 20px; } .pcontrols .seg button { border-radius: 16px; }
.pcontrols .btn { border-radius: 20px; }

/* ───── Modal (image editor) ───── */
.modal-bg { position: fixed; inset: 0; background: rgba(5,6,16,.72); backdrop-filter: blur(4px); display: grid; place-items: center; z-index: 50; animation: fade .15s; }
@keyframes fade { from { opacity: 0; } }
.modal { width: min(1320px, 96vw); height: min(820px, 94vh); background: var(--panel); border: 1px solid var(--border2); border-radius: 16px; display: grid; grid-template-rows: 1fr auto; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,.6); }
.modal .body { display: grid; grid-template-columns: 1fr 340px; min-height: 0; }
.modal .stage { background: linear-gradient(180deg, #1a1c3d, #0e0f22); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; position: relative; overflow: hidden; }
.modal .stage .frame { position: relative; box-shadow: 0 14px 40px rgba(0,0,0,.6); outline: 1px solid rgba(255,255,255,.25); cursor: grab; background: repeating-conic-gradient(#1b1d3a 0 25%, #212447 0 50%) 0 0 / 16px 16px; }
.modal .stage .frame.grabbing { cursor: grabbing; }
.modal .stage canvas { display: block; }
.modal .stage .guides { position: absolute; inset: 0; pointer-events: none; }
.modal .stage .hint { color: rgba(255,255,255,.6); font-size: 12px; }
.modal .insp { border-left: 1px solid var(--border); overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; background: var(--bg2); }
.modal .insp h2 { margin: 0; font-size: 18px; }
.igroup { background: var(--card); border: 1px solid var(--border); border-radius: 11px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.igroup > b { display: flex; align-items: center; gap: 8px; font-size: 13.5px; }
.igroup > b svg { width: 16px; height: 16px; color: var(--accent2); }
.igroup .slider-row { padding: 0; }
.modal .foot { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); background: var(--panel); }

.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: rgba(30,33,70,.95); border: 1px solid var(--border2); padding: 10px 18px; border-radius: 30px; font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,.4); z-index: 80; animation: up .2s; }
@keyframes up { from { transform: translate(-50%, 12px); opacity: 0; } }
.busy { position: fixed; inset: 0; background: rgba(5,6,16,.55); display: grid; place-items: center; z-index: 70; }
.busy div { background: var(--panel); border: 1px solid var(--border2); padding: 18px 24px; border-radius: 14px; display: flex; align-items: center; gap: 14px; }
.spinner { width: 22px; height: 22px; border: 3px solid #333a7a; border-top-color: var(--accent2); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.progress { height: 6px; width: 220px; background: #2a2d5a; border-radius: 6px; overflow: hidden; }
.progress div { height: 100%; background: var(--accent2); transition: width .15s; }

/* ── 3DS console shell around the live preview (sizes in console pixels × --s) ── */
.console.ds { --s: 1; --u: calc(var(--s) * 1px); display: flex; flex-direction: column; align-items: center; gap: 0; filter: drop-shadow(0 calc(var(--u) * 18) calc(var(--u) * 30) rgba(0,0,0,.55)); }
.ds-shell { position: relative; width: calc(var(--u) * 480); box-sizing: border-box; display: flex; justify-content: center;
  background: linear-gradient(180deg, #2b2f3d 0%, #1c1f2a 55%, #161923 100%); box-shadow: inset 0 calc(var(--u) * 1.5) 0 rgba(255,255,255,.12), inset 0 calc(var(--u) * -2) calc(var(--u) * 4) rgba(0,0,0,.35); }
.ds-top { height: calc(var(--u) * 296); padding-top: calc(var(--u) * 22); border-radius: calc(var(--u) * 26) calc(var(--u) * 26) calc(var(--u) * 10) calc(var(--u) * 10); }
.ds-bot { height: calc(var(--u) * 310); padding-top: calc(var(--u) * 16); border-radius: calc(var(--u) * 10) calc(var(--u) * 10) calc(var(--u) * 30) calc(var(--u) * 30);
  background: linear-gradient(180deg, #232733 0%, #1d202b 40%, #171a24 100%); }
.ds .bezel { padding: calc(var(--u) * 6); border-radius: calc(var(--u) * 7); background: #07080b; box-shadow: inset 0 0 0 calc(var(--u) * 1) rgba(255,255,255,.06), 0 0 0 calc(var(--u) * 1.2) rgba(0,0,0,.5); align-self: flex-start; }
.ds .bezel canvas { border-radius: calc(var(--u) * 1.5); }
.ds-hinge { position: relative; width: calc(var(--u) * 452); height: calc(var(--u) * 16); border-radius: calc(var(--u) * 8);
  background: linear-gradient(180deg, #11131a 0%, #3a3f50 35%, #232634 60%, #0d0f15 100%); }
.ds-led { position: absolute; right: calc(var(--u) * 26); top: calc(var(--u) * 5); width: calc(var(--u) * 6); height: calc(var(--u) * 6); border-radius: 50%; background: radial-gradient(circle at 35% 35%, #b9f3ff, #2aa8e8 60%, #10668e); box-shadow: 0 0 calc(var(--u) * 6) rgba(80,200,255,.8); }
.ds-cam { position: absolute; top: calc(var(--u) * 7); left: 50%; width: calc(var(--u) * 8); height: calc(var(--u) * 8); margin-left: calc(var(--u) * -4); border-radius: 50%; background: radial-gradient(circle at 35% 35%, #50607c, #0a0c12 65%); box-shadow: 0 0 0 calc(var(--u) * 1.5) #10121a; }
.ds-spk { position: absolute; top: calc(var(--u) * 74); display: grid; grid-template-columns: repeat(3, calc(var(--u) * 3.2)); gap: calc(var(--u) * 4.2) calc(var(--u) * 4); }
.ds-spk.l { left: calc(var(--u) * 7); } .ds-spk.r { right: calc(var(--u) * 7); }
.ds-spk .d { width: calc(var(--u) * 3.2); height: calc(var(--u) * 3.2); border-radius: 50%; background: #090a0f; box-shadow: inset 0 calc(var(--u) * .6) 0 rgba(0,0,0,.8), 0 calc(var(--u) * .5) 0 rgba(255,255,255,.08); }
.ds-slider { position: absolute; right: calc(var(--u) * 9); top: calc(var(--u) * 18); width: calc(var(--u) * 5); height: calc(var(--u) * 44); border-radius: calc(var(--u) * 3); background: #0b0c12; box-shadow: inset 0 0 0 calc(var(--u) * .8) rgba(255,255,255,.07); }
.ds-slider .k { position: absolute; left: calc(var(--u) * -1.5); top: calc(var(--u) * 22); width: calc(var(--u) * 8); height: calc(var(--u) * 10); border-radius: calc(var(--u) * 2); background: linear-gradient(90deg, #8b93a8, #c9cfdc 50%, #7b8296); }
.ds-3d { position: absolute; right: calc(var(--u) * 6); top: calc(var(--u) * 66); font: 800 calc(var(--u) * 6) system-ui, sans-serif; color: rgba(255,255,255,.35); letter-spacing: calc(var(--u) * .4); }
.ds-cpad { position: absolute; left: calc(var(--u) * 13); top: calc(var(--u) * 26); width: calc(var(--u) * 50); height: calc(var(--u) * 50); border-radius: 50%; background: #0c0e14; box-shadow: inset 0 calc(var(--u) * 1) calc(var(--u) * 3) rgba(0,0,0,.8); }
.ds-cpad .n { position: absolute; inset: calc(var(--u) * 6); border-radius: 50%; background: radial-gradient(circle at 40% 35%, #5c6274, #2b2f3b 60%, #1b1e27); box-shadow: 0 calc(var(--u) * 2) calc(var(--u) * 3) rgba(0,0,0,.6), inset 0 0 0 calc(var(--u) * 1) rgba(255,255,255,.08); }
.ds-dpad { position: absolute; left: calc(var(--u) * 16); top: calc(var(--u) * 112); width: calc(var(--u) * 44); height: calc(var(--u) * 44); }
.ds-dpad .h, .ds-dpad .v { position: absolute; border-radius: calc(var(--u) * 2.5); background: linear-gradient(180deg, #3d4252, #22252f); box-shadow: 0 calc(var(--u) * 1.5) 0 #0b0d12, inset 0 calc(var(--u) * 1) 0 rgba(255,255,255,.12); }
.ds-dpad .h { left: 0; right: 0; top: calc(var(--u) * 15); height: calc(var(--u) * 14); }
.ds-dpad .v { top: 0; bottom: 0; left: calc(var(--u) * 15); width: calc(var(--u) * 14); }
.ds-dpad .c { position: absolute; left: calc(var(--u) * 18); top: calc(var(--u) * 18); width: calc(var(--u) * 8); height: calc(var(--u) * 8); border-radius: 50%; background: radial-gradient(circle, #1a1d25, #2c3040); }
.ds-abxy { position: absolute; right: calc(var(--u) * 10); top: calc(var(--u) * 30); width: calc(var(--u) * 56); height: calc(var(--u) * 56); }
.ds-abxy .b { position: absolute; width: calc(var(--u) * 17); height: calc(var(--u) * 17); border-radius: 50%; display: grid; place-items: center; font: 800 calc(var(--u) * 8) system-ui, sans-serif; color: #c9cede;
  background: radial-gradient(circle at 40% 30%, #4a4f60, #262a35 70%); box-shadow: 0 calc(var(--u) * 1.6) 0 #0b0d12, inset 0 calc(var(--u) * 1) 0 rgba(255,255,255,.14); }
.ds-abxy .x { left: calc(var(--u) * 19.5); top: 0; } .ds-abxy .y { left: 0; top: calc(var(--u) * 19.5); } .ds-abxy .a { right: 0; top: calc(var(--u) * 19.5); } .ds-abxy .b2 { left: calc(var(--u) * 19.5); bottom: 0; }
.ds-power { position: absolute; right: calc(var(--u) * 28); top: calc(var(--u) * 210); width: calc(var(--u) * 12); height: calc(var(--u) * 12); border-radius: 50%; background: radial-gradient(circle at 40% 35%, #3c4152, #1c1f29); box-shadow: inset 0 0 0 calc(var(--u) * 1.2) rgba(255,255,255,.08); }
.ds-power::after { content: ''; position: absolute; inset: calc(var(--u) * 3.3); border-radius: 50%; border: calc(var(--u) * 1) solid rgba(255,255,255,.45); border-top-color: transparent; }
.ds-row { position: absolute; bottom: calc(var(--u) * 12); left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: calc(var(--u) * 26); }
.ds-sm { font: 700 calc(var(--u) * 6) system-ui, sans-serif; letter-spacing: calc(var(--u) * .6); color: rgba(255,255,255,.42); padding: calc(var(--u) * 3) calc(var(--u) * 8); border-radius: calc(var(--u) * 6); background: #11131a; box-shadow: inset 0 0 0 calc(var(--u) * .8) rgba(255,255,255,.08); }
.ds-home { width: calc(var(--u) * 30); height: calc(var(--u) * 12); border-radius: calc(var(--u) * 6); background: linear-gradient(180deg, #3a3f50, #20232d); box-shadow: 0 calc(var(--u) * 1) 0 #0b0d12, inset 0 calc(var(--u) * .8) 0 rgba(255,255,255,.12); position: relative; }
.ds-home::after { content: ''; position: absolute; left: 50%; top: 50%; width: calc(var(--u) * 7); height: calc(var(--u) * 5); margin: calc(var(--u) * -2) 0 0 calc(var(--u) * -3.5); background: #8fd7ff; clip-path: polygon(50% 0, 100% 45%, 85% 45%, 85% 100%, 15% 100%, 15% 45%, 0 45%); opacity: .85; }
.ds-mic { position: absolute; right: calc(var(--u) * 104); bottom: calc(var(--u) * 16); width: calc(var(--u) * 3); height: calc(var(--u) * 3); border-radius: 50%; background: #07080b; }
/* Small screens: keep the shell but drop the side controls */
.console.ds.compact .ds-shell { width: calc(var(--u) * 440); }
.console.ds.compact .ds-top { height: calc(var(--u) * 270); padding-top: calc(var(--u) * 12); border-radius: calc(var(--u) * 16) calc(var(--u) * 16) calc(var(--u) * 6) calc(var(--u) * 6); }
.console.ds.compact .ds-bot { height: calc(var(--u) * 262); padding-top: calc(var(--u) * 8); border-radius: calc(var(--u) * 6) calc(var(--u) * 6) calc(var(--u) * 18) calc(var(--u) * 18); }
.console.ds.compact .ds-hinge { width: calc(var(--u) * 420); height: calc(var(--u) * 8); }
.console.ds.compact .ds-cpad, .console.ds.compact .ds-dpad, .console.ds.compact .ds-abxy, .console.ds.compact .ds-power, .console.ds.compact .ds-row,
.console.ds.compact .ds-mic, .console.ds.compact .ds-spk, .console.ds.compact .ds-slider, .console.ds.compact .ds-3d, .console.ds.compact .ds-led, .console.ds.compact .ds-cam { display: none; }

/* ───── Web additions ───── */
html, body { height: 100%; }
#app { height: 100vh; height: 100dvh; }
#menuWrap { position: relative; }
#menu { position: absolute; right: 0; top: calc(100% + 8px); min-width: 250px; background: var(--panel); border: 1px solid var(--border2); border-radius: 12px; padding: 6px; display: none; flex-direction: column; z-index: 90; box-shadow: 0 18px 50px rgba(0,0,0,.55); }
#menu.open { display: flex; }
#menu button { text-align: left; background: transparent; border: 0; padding: 9px 12px; border-radius: 8px; cursor: pointer; color: var(--text); font-size: 13.5px; }
#menu button:hover { background: rgba(255,255,255,.07); }
#menu hr { border: 0; border-top: 1px solid var(--border); margin: 5px 4px; width: auto; }
#previewToggle { display: none; }
input[type=range]::-moz-range-track { height: 5px; border-radius: 5px; background: #2f3263; }
input[type=range]::-moz-range-progress { height: 5px; border-radius: 5px; background: var(--accent); }
input[type=range]::-moz-range-thumb { width: 17px; height: 17px; border: 0; border-radius: 50%; background: #fff; }
.web-note { font-size: 12px; color: var(--text3); }

#topbar { padding-top: env(safe-area-inset-top); }
/* Medium screens: drop the preview width a little */
@media (max-width: 1200px) and (min-width: 861px) {
  #main { grid-template-columns: 210px minmax(380px, 1fr) minmax(340px, 0.85fr); }
  #topbar .brand { min-width: 0; }
}

/* ───── Phones and small tablets ───── */
@media (max-width: 860px) {
  body { font-size: 14.5px; -webkit-tap-highlight-color: transparent; }
  .desktop-only { display: none !important; }
  #app { grid-template-rows: auto 1fr; }
  #topbar { padding: 8px 10px; padding-top: max(8px, env(safe-area-inset-top)); gap: 8px; min-height: 54px; }
  #topbar .brand { min-width: 0; }
  #topbar .brand small, #topbar .doc { display: none; }
  #topbar .brand img { width: 30px; height: 30px; }
  #topbar .actions { margin-left: auto; gap: 4px; }
  #topbar .actions .btn:not(.icon) { padding: 7px 10px; }
  #topbar .actions .btn.icon { display: none; }

  #main { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  #preview { order: 0; flex: none; height: 37vh; height: 37dvh; border-left: 0; border-bottom: 1px solid var(--border); justify-content: flex-start; padding-top: 8px; }
  #preview .label { display: none; }
  .console { gap: 6px; }
  .bezel { padding: 4px; border-radius: 8px; }
  .pcontrols { bottom: 4px; padding: 3px; gap: 4px; }
  .pcontrols .btn.ghost { display: none; }
  .pcontrols .btn, .pcontrols .seg button { padding: 4px 9px; font-size: 12px; }
  body.pv-hidden #preview { display: none; }

  #sidebar { order: 1; flex: none; flex-direction: row; overflow-x: auto; overflow-y: hidden; padding: 6px 8px; gap: 4px; border-right: 0; border-bottom: 1px solid var(--border); scrollbar-width: none; }
  #sidebar::-webkit-scrollbar { display: none; }
  .nav-group { display: flex; gap: 4px; margin: 0; }
  .nav-group h6, .sidebar-foot { display: none; }
  .nav-item { white-space: nowrap; padding: 7px 11px; border-radius: 20px; background: rgba(255,255,255,.04); font-size: 13px; }
  .nav-item.active::before { display: none; }
  .nav-item.active { background: var(--accent); }
  .nav-item svg { width: 15px; height: 15px; }
  .nav-item .badge { margin-left: 2px; }

  #editor { order: 2; flex: 1; padding: 14px 12px calc(40px + env(safe-area-inset-bottom)); -webkit-overflow-scrolling: touch; }
  #previewToggle { display: inline-flex; }
  .page-head .ico { width: 38px; height: 38px; }
  .page-head h1 { font-size: 19px; }
  .card { padding: 13px; }
  .cols2, .big-actions { grid-template-columns: 1fr; }
  .modes { grid-auto-flow: row; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); }
  .row:not(.color-row) { flex-wrap: wrap; }
  .color-row { flex-wrap: nowrap; padding: 5px 2px; }
  .color-row input.hex { width: 84px; }
  .seg { flex-wrap: wrap; }
  .btn { padding: 8px 13px; }
  input[type=text], textarea, select { font-size: 16px; }
  .slider-row { padding: 2px 2px; }
  input[type=range]::-webkit-slider-thumb { width: 22px; height: 22px; margin-top: -9px; }
  .palette div { width: 32px; height: 32px; }
  .thumb .hover { display: none; }

  .modal-bg { place-items: stretch; }
  .modal { width: 100vw; height: 100vh; height: 100dvh; border-radius: 0; border: 0; }
  .modal .body { grid-template-columns: 1fr; grid-template-rows: 42vh 1fr; grid-template-rows: 42dvh 1fr; }
  .modal .stage { gap: 6px; }
  .modal .insp { border-left: 0; border-top: 1px solid var(--border); padding: 12px; }
  .modal .foot { flex-wrap: wrap; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); }
  .modal .foot .grow { display: none; }
  .modal .foot .btn { flex: 1; justify-content: center; }

  .toast { bottom: calc(18px + env(safe-area-inset-bottom)); max-width: 92vw; text-align: center; }
  .busy div { margin: 0 16px; }
  .progress { width: 160px; }
}

@media (max-width: 430px) {
  #topbar .brand > div { display: none; }
  #topbar .actions .btn { font-size: 12.5px; }
}

.dlg-bg { z-index: 95; padding: 16px; place-items: center !important; }
.dlg { height: auto; align-self: center; background: var(--panel); border: 1px solid var(--border2); border-radius: 14px; padding: 20px; width: min(420px, 100%); display: flex; flex-direction: column; gap: 10px; box-shadow: 0 30px 80px rgba(0,0,0,.6); }
.dlg b { font-size: 16px; }
.dlg p { margin: 0; color: var(--text2); white-space: pre-wrap; }
.dlg-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; flex-wrap: wrap; }
</style>

// Picture loading, editing (resize/crop/rotate/flip/color) and conversion helpers.
const Imaging = {
  defaultEdit(fit = 'fill') {
    return { fit, zoom: 1, offsetX: 0, offsetY: 0, quarterTurns: 0, angle: 0, flipH: false, flipV: false, background: [0, 0, 0],

  },
  resetColor(e) { Object.assign(e, { brightness: 0, contrast: 1, saturation: 1, hue: 0, warmth: 0, sharpen: 0, blur: 0, vignette: 0 }); },
  resetGeometry(e) { Object.assign(e, { zoom: 1, offsetX: 0, offsetY: 0, quarterTurns: 0, angle: 0, flipH: false, flipV: false }); },

  /** Loads a picture file into a canvas (shrunk if huge). */
  async loadPath(path) {
    const bytes = window.api.readFile(path);

  },
  async loadBytes(bytes, maxSide = 2400) {
    const bmp = await createImageBitmap(new Blob([bytes]));

  renderCanvas(src, w, h, e) {

    const turns = ((e.quarterTurns % 4) + 4) % 4, odd = turns % 2 === 1;
    const iw = src.width, ih = src.height, dw = odd ? ih : iw, dh = odd ? iw : ih;
    let sx, sy;
    if (e.fit === 'fill') { sx = sy = Math.max(w / dw, h / dh); }
    else if (e.fit === 'fit') { sx = sy = Math.min(w / dw, h / dh); }
    else { sx = w / dw; sy = h / dh; }
    sx *= e.zoom; sy *= e.zoom;

    if (e.saturation !== 1) filters.push(`saturate(${e.saturation})`);

    ctx.scale(e.flipH ? -1 : 1, e.flipV ? -1 : 1);
    ctx.rotate(turns * Math.PI / 2 + e.angle * Math.PI / 180);

    ctx.restore();
    ctx.filter = 'none';

  },

  canvasToImage(c) {
    const d = c.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, c.width, c.height).data;

  },
  imageToCanvas(img, mask = false) {

  consolePreview(img, format, dither) {

  async canvasPNG(c) {

  /** Most-used colors, grouped and de-duplicated. */

  },
};

  // ───────────── Top screen ─────────────

    // signal + "Internet"

  /** Renders the 412×480 preview.png used by theme managers. */

  function mountShell(consoleEl) {

})();

<script>
// Audio import (any format Chromium can decode: MP3, WAV, M4A/AAC, OGG, FLAC, WebM…), playback and background encoding.
const Audio3DS = (() => {
  const worker = new Worker(window.__workerURL);
  let nextId = 1;
  const pending = new Map();
  worker.onmessage = (e) => {
    const { id, result, error, progress } = e.data, p = pending.get(id);
    if (!p) return;
    if (progress !== undefined) { p.onProgress && p.onProgress(progress); return; }
    pending.delete(id);
    error ? p.reject(new Error(error)) : p.resolve(result);
  };
  function run(cmd, payload, onProgress) {
    return new Promise((resolve, reject) => { const id = nextId++; pending.set(id, { resolve, reject, onProgress }); worker.postMessage({ id, cmd, payload }); });
  }

  /** Decodes an audio file to 16-bit PCM at `rate` with `channels` channels. */
  async function load(path, rate, channels, maxSeconds = 900) {
    const bytes = window.api.readFile(path);
    const ctx = new OfflineAudioContext(2, 1, rate);
    let buf;
    try { buf = await ctx.decodeAudioData(bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength)); }
    catch (e) { throw new Error(`“${window.api.basename(path)}” isn't an audio format MtM3 can read. Try MP3, WAV, M4A, OGG or FLAC.`); }
    const n = Math.min(buf.length, Math.floor(maxSeconds * rate));
    const src = []; for (let c = 0; c < buf.numberOfChannels; c++) src.push(buf.getChannelData(c));
    const out = [];
    for (let c = 0; c < channels; c++) {
      const ch = new Int16Array(n);
      for (let i = 0; i < n; i++) {
        let v;
        if (channels === 1) { v = 0; for (const s of src) v += s[i]; v /= src.length; }
        else v = src[Math.min(c, src.length - 1)][i];
        ch[i] = Math.max(-32768, Math.min(32767, Math.round(v * 32767)));
      }
      out.push(ch);
    }
    return { sampleRate: rate, channels: out, looping: false, loopStart: 0 };
  }

  // Playback
  let actx = null, source = null;
  function play(pcm, loop) {
    stop();
    if (!pcm || !pcm.channels.length || !pcm.channels[0].length) return;
    actx = actx || new AudioContext();
    const b = actx.createBuffer(pcm.channels.length, pcm.channels[0].length, pcm.sampleRate);
    pcm.channels.forEach((ch, c) => { const d = b.getChannelData(c); for (let i = 0; i < ch.length; i++) d[i] = ch[i] / 32768; });
    source = actx.createBufferSource(); source.buffer = b;
    if (loop) { source.loop = true; source.loopStart = pcm.looping ? pcm.loopStart / pcm.sampleRate : 0; source.loopEnd = b.duration; }
    source.connect(actx.destination); source.start();
  }
  function stop() { if (source) { try { source.stop(); } catch (e) { /* already stopped */ } source = null; } }
  const isPlaying = () => !!source;

  function decodeNintendo(bytes) {
    if (bytes[0] === 0x43 && bytes[1] === 0x57) return TK.BCWAV.decode(bytes);   // "CW"
    return TK.BCSTM.decode(bytes);
  }

  /** Trims, applies edits, fits to the 3DS limit and sets the loop point. */
  function prepareMusic(pcm, edit, loopStartSeconds, rate, channels) {
    let a = TK.AudioProcess.apply(pcm, edit);
    const maxSamples = Math.floor(TK.AudioProcess.maxSeconds(rate, channels) * rate);
    let trimmed = false;
    if (a.channels[0].length > maxSamples) { a.channels = a.channels.map((c) => c.slice(0, maxSamples)); trimmed = true; }
    a.looping = true;
    a.loopStart = Math.min(Math.floor(loopStartSeconds * rate), Math.max(0, a.channels[0].length - 14336));
    return { audio: a, trimmed };
  }

  return { load, play, stop, isPlaying, decodeNintendo, prepareMusic,
    encodeBCSTM: (a, onProgress) => run('bcstm', a, onProgress),
    encodeBCWAV: (a) => run('bcwav', a),
    compressBody: (t) => run('body', t) };
})();

<script>
// MtM3 application state and core actions.
const SECTIONS = [
  { id: 'info', title: 'Theme Info', icon: 'info', group: 'Theme' },
  { id: 'top', title: 'Top Screen', icon: 'top', group: 'Wallpapers' },
  { id: 'bottom', title: 'Bottom Screen', icon: 'bottom', group: 'Wallpapers' },
  { id: 'icons', title: 'Icons & Cursor', icon: 'grid', group: 'Interface Colors' },
  { id: 'buttons', title: 'Buttons & Arrows', icon: 'buttons', group: 'Interface Colors' },
  { id: 'folderView', title: 'Folder View', icon: 'folder', group: 'Interface Colors' },
  { id: 'text', title: 'Text Boxes', icon: 'text', group: 'Interface Colors' },
  { id: 'music', title: 'Background Music', icon: 'music', group: 'Audio' },
  { id: 'sounds', title: 'Sound Effects', icon: 'speaker', group: 'Audio' },
  { id: 'converter', title: 'Converter Tools', icon: 'convert', group: 'Tools & Finish' },
  { id: 'export', title: 'Export & Share', icon: 'export', group: 'Tools & Finish' },
];
const SMALL_SLOTS = ['folderClosed', 'folderOpen', 'fileLarge', 'fileSmall', 'topPattern', 'topAltPattern'];

const App = {
  theme: TK.Theme.create(),
  name: '', description: '', author: '',
  smdh: TK.SMDH.create(),
  icon: TK.SMDH.defaultIcon(48),
  iconCanvas: null,
  sources: {},          // slot -> { canvas, edit, fileName }
  images: {},           // slot -> canvas for drawing the preview
  palette: [],
  bgm: { data: null, source: null, sourceName: null, sourcePath: null, preview: null, busy: false, progress: 0, settings: { rate: 32000, mono: false, loopStart: 0, edit: TK.AudioProcess.defaultEdit() } },
  sfx: new Array(8).fill(null), sfxNames: new Array(8).fill(null),
  section: 'info', animate: true, previewMode: 'home', dirty: false, path: null,
  get folderMode() { return this.previewMode === 'folder'; },
  set folderMode(v) { this.previewMode = v ? 'folder' : 'home'; },
  showPreview(mode) { if (mode && this.previewMode !== mode) { this.previewMode = mode; this.renderPreviewControls(); } },
  undoStack: [], redoStack: [], lastSnap: null, lastPush: 0, paletteTimer: null,

  // ───── change tracking ─────
  snapshot() {
    const t = this.theme;
    return { flags: structuredClone(t.flags), colors: structuredClone(t.colors), textures: { ...t.textures }, sfx: t.soundEffectData, dither: t.ditherBackgrounds };
  },
  restore(s) {
    Object.assign(this.theme, { flags: structuredClone(s.flags), colors: structuredClone(s.colors), textures: { ...s.textures }, soundEffectData: s.sfx, ditherBackgrounds: s.dither });
    this.refreshImages();
    this.sfx = TK.SFXBlock.decode(this.theme.soundEffectData);
    this.lastSnap = this.snapshot();
    this.setDirty(true); this.renderPage(); this.renderSidebar();
  },
  changed(structural = false) {
    const now = Date.now();
    if (this.lastSnap && now - this.lastPush > 600) { this.undoStack.push(this.lastSnap); if (this.undoStack.length > 60) this.undoStack.shift(); this.redoStack = []; }
    this.lastPush = now;
    this.changeCount = (this.changeCount || 0) + 1;
    this.lastSnap = this.snapshot();
    this.setDirty(true);
    if (structural) this.renderPage();
    this.renderSidebar();
    this.updateTopbar();
  },
  undo() { const s = this.undoStack.pop(); if (!s) return; this.redoStack.push(this.snapshot()); this.restore(s); toast('Undone'); },
  redo() { const s = this.redoStack.pop(); if (!s) return; this.undoStack.push(this.snapshot()); this.restore(s); toast('Redone'); },
  setDirty(v) { this.dirty = v; document.getElementById('dirtyDot').classList.toggle('on', v); },

  // ───── textures ─────
  setTexture(slot, img, quiet) {
    if (img) this.theme.textures[slot] = img; else delete this.theme.textures[slot];
    this.refreshImage(slot);
    this.schedulePalette();
    if (!quiet) this.changed();
  },
  refreshImage(slot) {
    const img = this.theme.textures[slot];
    if (img) this.images[slot] = Imaging.imageToCanvas(img, TK.SLOTS[slot] === 'a8'); else delete this.images[slot];
  },
  refreshImages() { this.images = {}; for (const s of Object.keys(TK.SLOTS)) this.refreshImage(s); this.schedulePalette(); },
  schedulePalette() {
    clearTimeout(this.paletteTimer);
    this.paletteTimer = setTimeout(() => {
      const f = this.theme.flags, out = [];
      for (const slot of ['top', 'bottom']) {
        const img = this.theme.textures[slot]; if (!img) continue;
        const [w, h] = TK.Geometry.visible(slot, f);
        out.push(...Imaging.palette(TK.cropImage(img, Math.min(w, img.width), Math.min(h, img.height)), 12));
      }
      const seen = new Set(); this.palette = out.filter((c) => { const k = c.join(); if (seen.has(k)) return false; seen.add(k); return true; });
      document.querySelectorAll('.palette-host').forEach((n) => n.replaceWith(Pages.paletteCard()));
    }, 250);
  },
  renderSlotImage(slot, edit) {
    const src = this.sources[slot]; if (!src) return null;
    const [vw, vh] = TK.Geometry.visible(slot, this.theme.flags);
    return Imaging.canvasToImage(Imaging.renderCanvas(src.canvas, vw, vh, edit || src.edit));
  },
  renderSlot(slot, quiet) {
    const vis = this.renderSlotImage(slot); if (!vis) return;
    const [cw, ch] = TK.Geometry.canvas(slot, this.theme.flags);
    this.setTexture(slot, TK.bleedImage(vis, cw, ch), quiet);
  },
  async setPicture(slot, canvas, fileName) {
    this.sources[slot] = { canvas, edit: Imaging.defaultEdit(SMALL_SLOTS.includes(slot) ? 'stretch' : 'fill'), fileName };
    this.renderSlot(slot, true);
    const f = this.theme.flags, t = this.theme.textures;
    if (slot === 'top') f.topDrawType = 3;
    if (slot === 'topPattern' || slot === 'topAltPattern') f.topDrawType = 2;
    if (slot === 'bottom') f.bottomDrawType = 3;
    if ((slot === 'folderClosed' || slot === 'folderOpen') && t.folderClosed && t.folderOpen) f.folderTexture = true;
    if ((slot === 'fileLarge' || slot === 'fileSmall') && t.fileLarge && t.fileSmall) f.fileTexture = true;
    this.changed(true);
  },
  async loadPicture(slot, path) {
    try { await this.setPicture(slot, await Imaging.loadPath(path), window.api.basename(path)); if (slot === 'top' || slot === 'bottom') toast('Picture added. Tap it to crop, resize, rotate or adjust colors.'); }
    catch (e) { alertError(`“${window.api.basename(path)}” couldn't be opened as a picture.`); }
  },
  clearPicture(slot) { delete this.sources[slot]; this.setTexture(slot, null, true); this.changed(true); },
  frameChanged() { for (const s of ['top', 'bottom']) if (this.sources[s]) this.renderSlot(s, true); this.schedulePalette(); },
  setIcon(canvas) {
    const c = Imaging.renderCanvas(canvas, 48, 48, Imaging.defaultEdit('fill'));
    this.icon = Imaging.canvasToImage(c); this.iconCanvas = Imaging.imageToCanvas(this.icon);
    this.changed(true); this.renderSidebar();
  },

  // ───── new / open ─────
  async confirmDiscard() {
    if (!this.dirty) return true;
    return (await window.api.confirm(`Discard unsaved changes to “${this.displayName()}”?`, "Your changes haven't been exported yet.", ['Discard Changes', 'Cancel'])) === 0;
  },
  displayName() { return this.name.trim() || 'Untitled Theme'; },
  reset() {
    Audio3DS.stop();
    this.theme = TK.Theme.create(); this.name = ''; this.description = ''; this.author = '';
    this.smdh = TK.SMDH.create(); this.icon = TK.SMDH.defaultIcon(48); this.iconCanvas = Imaging.imageToCanvas(this.icon);
    this.sources = {}; this.images = {}; this.palette = [];
    this.bgm = { data: null, source: null, sourceName: null, sourcePath: null, preview: null, busy: false, progress: 0, settings: { rate: 32000, mono: false, loopStart: 0, edit: TK.AudioProcess.defaultEdit() } };
    this.sfx = new Array(8).fill(null); this.sfxNames = new Array(8).fill(null);
    this.undoStack = []; this.redoStack = []; this.lastSnap = this.snapshot(); this.path = null;
    this.setDirty(false); this.section = 'info'; this.renderAll();
  },
  findIn(entries, name) { return entries.find((e) => e.name.split(/[\\/]/).pop().toLowerCase() === name.toLowerCase() && !e.name.includes('__MACOSX')); },
  async open(path) {
    try {
      let entries = [];
      if (window.api.isDir(path)) {
        entries = window.api.readdir(path).filter((n) => /\.(bin|smdh|bcstm|png)$/i.test(n)).map((n) => ({ name: n, data: window.api.readFile(window.api.join(path, n)) }));
      } else {
        const bytes = window.api.readFile(path);
        if (bytes[0] === 0x50 && bytes[1] === 0x4B) entries = TK.Zip.read(bytes, (b) => window.api.inflateRaw(b));
        else {
          entries = [{ name: 'body_LZ.bin', data: bytes }];
          const dir = window.api.dirname(path);
          for (const n of window.api.readdir(dir)) if (/^(info\.smdh|bgm\.bcstm|preview\.png)$/i.test(n)) entries.push({ name: n, data: window.api.readFile(window.api.join(dir, n)) });
        }
      }
      const body = this.findIn(entries, 'body_LZ.bin');
      if (!body) throw new Error("There's no body_LZ.bin in this theme.");
      const theme = TK.Theme.read(body.data);
      this.reset();
      this.theme = theme;
      const smdhE = this.findIn(entries, 'info.smdh');
      if (smdhE) { try { this.smdh = TK.SMDH.read(smdhE.data); const p = TK.SMDH.primary(this.smdh); this.name = p.short; this.description = p.long; this.author = p.publisher; this.icon = this.smdh.largeIcon; this.iconCanvas = Imaging.imageToCanvas(this.icon); } catch (e) { /* ignore broken smdh */ } }
      for (const slot of Object.keys(theme.textures)) {
        const img = theme.textures[slot], [vw, vh] = TK.Geometry.visible(slot, theme.flags);
        this.sources[slot] = { canvas: Imaging.imageToCanvas(TK.cropImage(img, Math.min(vw, img.width), Math.min(vh, img.height))), edit: Imaging.defaultEdit('stretch'), fileName: 'From theme' };
      }
      this.sfx = TK.SFXBlock.decode(theme.soundEffectData);
      this.sfx.forEach((s, i) => { if (s) this.sfxNames[i] = 'From theme'; });
      const bgmE = this.findIn(entries, 'bgm.bcstm');
      if (bgmE) { this.bgm.data = bgmE.data; this.bgm.sourceName = 'bgm.bcstm (from theme)'; try { this.bgm.preview = TK.BCSTM.decode(bgmE.data); } catch (e) { /* preview unavailable */ } }
      this.refreshImages();
      this.path = path; this.lastSnap = this.snapshot(); this.setDirty(false);
      this.renderAll();
      toast(`Opened “${this.displayName()}”`);
    } catch (e) { alertError(`Couldn't open this theme: ${e.message}`); }
  },
  async openFileDialog() {
    if (!(await this.confirmDiscard())) return;
    const p = await window.api.openFile('Open a theme (.zip or body_LZ.bin)', [{ name: '3DS Themes', extensions: ['zip', 'bin'] }]);
    if (p) this.open(p);
  },
  async openFolderDialog() {
    if (!(await this.confirmDiscard())) return;
    const p = await window.api.openFolder('Open a theme folder', 'Open');
    if (p) this.open(p);
  },

  // ───── music & sounds ─────
  async importMusic(path) {
    Audio3DS.stop();
    const ext = window.api.extname(path).toLowerCase();
    if (ext === '.bcstm') {
      try {
        const bytes = window.api.readFile(path);
        this.bgm.preview = TK.BCSTM.decode(bytes); this.bgm.data = bytes; this.bgm.source = null; this.bgm.sourceName = window.api.basename(path);
        this.theme.flags.backgroundMusic = true; this.changed(true);
        if (bytes.length > TK.Limits.maxBGM) alertError(`This BCSTM is ${fmtBytes(bytes.length)}, over the 3DS limit of ${fmtBytes(TK.Limits.maxBGM)}.`);
      } catch (e) { alertError(`Couldn't read this BCSTM: ${e.message}`); }
      return;
    }
    const s = this.bgm.settings;
    this.bgm.busy = true; this.bgm.progress = 0; this.bgm.sourceName = window.api.basename(path); this.bgm.sourcePath = path; this.renderPage();
    try {
      this.bgm.source = await Audio3DS.load(path, s.rate, s.mono ? 1 : 2);
      this.theme.flags.backgroundMusic = true;
      await this.encodeMusic();
    } catch (e) { this.bgm.busy = false; this.renderPage(); alertError(e.message); }
  },
  async applyMusicSettings() {
    const s = this.bgm.settings, src = this.bgm.source; if (!src) return;
    if (src.sampleRate !== s.rate || src.channels.length !== (s.mono ? 1 : 2)) {
      if (this.bgm.sourcePath && window.api.exists(this.bgm.sourcePath)) return this.importMusic(this.bgm.sourcePath);
    }
    return this.encodeMusic();
  },
  async encodeMusic() {
    const s = this.bgm.settings; Audio3DS.stop();
    this.bgm.busy = true; this.renderPage();
    const { audio, trimmed } = Audio3DS.prepareMusic(this.bgm.source, s.edit, s.loopStart, s.rate, s.mono ? 1 : 2);
    try {
      const bytes = await Audio3DS.encodeBCSTM(audio, (p) => { this.bgm.progress = p; const bar = document.querySelector('#bgmProgress div'); if (bar) bar.style.width = Math.round(p * 100) + '%'; });
      this.bgm.data = bytes; this.bgm.preview = TK.BCSTM.decode(bytes);
      toast(trimmed ? `Music was trimmed to ${fmtTime(TK.AudioProcess.maxSeconds(s.rate, s.mono ? 1 : 2))} to fit the 3DS limit.` : `Music converted (${fmtBytes(bytes.length)}).`);
    } catch (e) { alertError('Music conversion failed: ' + e.message); }
    this.bgm.busy = false; this.changed(true);
  },
  removeMusic() { Audio3DS.stop(); Object.assign(this.bgm, { data: null, source: null, sourceName: null, sourcePath: null, preview: null }); this.theme.flags.backgroundMusic = false; this.changed(true); },
  editedMusicSeconds() {
    const src = this.bgm.source; if (!src) return this.bgm.preview ? this.bgm.preview.channels[0].length / this.bgm.preview.sampleRate : 0;
    const e = this.bgm.settings.edit; let sec = Math.max(0, src.channels[0].length / src.sampleRate - e.startSeconds); if (e.maxSeconds > 0) sec = Math.min(sec, e.maxSeconds); return sec;
  },
  syncSfx() { this.theme.soundEffectData = TK.SFXBlock.isEmpty(this.sfx) ? new Uint8Array(0) : TK.SFXBlock.encode(this.sfx); },
  async importSound(path, i) {
    try {
      let data;
      if (window.api.extname(path).toLowerCase() === '.bcwav') { data = window.api.readFile(path); TK.BCWAV.decode(data); }
      else {
        const edit = { ...TK.AudioProcess.defaultEdit(), trimSilence: true, maxSeconds: 4 };
        data = await Audio3DS.encodeBCWAV(TK.AudioProcess.apply(await Audio3DS.load(path, 22050, 1, 10), edit));
      }
      this.sfx[i] = data; this.sfxNames[i] = window.api.basename(path); this.syncSfx();
      this.theme.flags.soundEffects = true; this.changed(true);
      if (TK.SFXBlock.estimatedSize(this.sfx) > TK.Limits.maxSoundEffects) alertError('Sound effects are now over the 3DS size limit (about 187 KB in total). Use shorter sounds.');
    } catch (e) { alertError(`Couldn't import “${window.api.basename(path)}”: ${e.message}`); }
  },
  clearSound(i) { this.sfx[i] = null; this.sfxNames[i] = null; this.syncSfx(); if (TK.SFXBlock.isEmpty(this.sfx)) this.theme.flags.soundEffects = false; this.changed(true); },

  // ───── export ─────
  async buildPackage() {
    TK.SMDH.setAll(this.smdh, this.name, this.description, this.author);
    this.smdh.largeIcon = this.icon; this.smdh.smallIcon = TK.SMDH.downscale(this.icon, 24);
    const preview = await Imaging.canvasPNG(Preview.exportCanvas(this.previewState()));
    const theme = { ...this.theme, soundEffectData: this.theme.flags.soundEffects ? TK.SFXBlock.encode(this.sfx) : new Uint8Array(0) };
    const body = await Audio3DS.compressBody(theme);
    const pkg = { theme, info: this.smdh, bgm: this.bgm.data, preview };
    return { pkg, body, validation: TK.validate(pkg, body) };
  },
  async exportFolder() {
    const parent = await window.api.openFolder('Choose where to save the theme folder', 'Export Here'); if (!parent) return;
    Busy.show('Building theme…');
    try {
      const { pkg, body, validation } = await this.buildPackage();
      Busy.hide();
      if (validation.errors.length) return alertError(validation.errors[0]);
      const dir = window.api.join(parent, TK.safeName(this.name)); window.api.mkdir(dir);
      for (const f of TK.packageFiles(pkg, body)) window.api.writeFile(window.api.join(dir, f.name), f.data);
      if (!this.theme.flags.backgroundMusic) window.api.remove(window.api.join(dir, 'bgm.bcstm'));
      this.path = dir; this.setDirty(false); this.updateTopbar();
      toast(`Exported “${TK.safeName(this.name)}”`); window.api.reveal(window.api.join(dir, 'body_LZ.bin'));
    } catch (e) { Busy.hide(); alertError('Export failed: ' + e.message); }
  },
  async exportZip() {
    const out = await window.api.saveFile('Export Theme ZIP', TK.safeName(this.name) + '.zip', [{ name: 'ZIP archive', extensions: ['zip'] }]); if (!out) return;
    Busy.show('Building theme…');
    try {
      const { pkg, body, validation } = await this.buildPackage();
      Busy.hide();
      if (validation.errors.length) return alertError(validation.errors[0]);
      window.api.writeFile(out, TK.Zip.write(TK.packageFiles(pkg, body)));
      this.setDirty(false); toast(`Saved ${window.api.basename(out)}`); window.api.reveal(out);
    } catch (e) { Busy.hide(); alertError('Export failed: ' + e.message); }
  },
  async savePreview() {
    const out = await window.api.saveFile('Save Preview Image', 'preview.png', [{ name: 'PNG image', extensions: ['png'] }]); if (!out) return;
    window.api.writeFile(out, await Imaging.canvasPNG(Preview.exportCanvas(this.previewState()))); toast('Saved preview image');
  },
  async exportPreset() {
    const out = await window.api.saveFile('Export Colors & Settings', TK.safeName(this.name) + ' Colors.json', [{ name: 'MtM3 preset', extensions: ['json'] }]); if (!out) return;
    window.api.writeFile(out, new TextEncoder().encode(JSON.stringify({ app: 'MtM3', formatVersion: 1, flags: this.theme.flags, colors: this.theme.colors }, null, 2)));
    toast('Saved colors');
  },
  async importPreset() {
    const p = await window.api.openFile('Import Colors & Settings', [{ name: 'MtM3 preset', extensions: ['json'] }]); if (!p) return;
    try {
      const j = JSON.parse(new TextDecoder().decode(window.api.readFile(p)));
      if (!j.colors || !j.flags) throw new Error('bad preset');
      const t = this.theme, keep = { backgroundMusic: t.flags.backgroundMusic, soundEffects: t.flags.soundEffects };
      t.colors = Object.assign(TK.Theme.defaultColors(), j.colors);
      t.flags = Object.assign(TK.Theme.defaultFlags(), j.flags, keep);
      if (t.flags.topDrawType === 3 && !t.textures.top) t.flags.topDrawType = 0;
      if (t.flags.bottomDrawType === 3 && !t.textures.bottom) t.flags.bottomDrawType = 0;
      if (t.flags.folderTexture && !(t.textures.folderClosed && t.textures.folderOpen)) t.flags.folderTexture = false;
      if (t.flags.fileTexture && !(t.textures.fileLarge && t.textures.fileSmall)) t.flags.fileTexture = false;
      this.frameChanged(); this.changed(true); toast('Imported colors');
    } catch (e) { alertError("That file isn't an MtM3 color preset."); }
  },

  // ───── rendering ─────
  previewState() { return { theme: this.theme, images: { ...this.images, __defaultPattern: this.defaultPatternCanvas }, icon: this.iconCanvas, mode: this.previewMode, title: this.name || 'My Theme', time: 0, forExport: false }; },
  go(section) { this.section = section; Audio3DS.stop(); this.showPreview({ icons: 'home', buttons: 'home', top: 'home', bottom: 'home', folderView: 'folder', text: 'zoom' }[section]); this.renderSidebar(); this.renderPage(); document.getElementById('editor').scrollTop = 0; const act = document.querySelector('#sidebar .nav-item.active'); if (act && window.innerWidth <= 860) act.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' }); },
  renderAll() { this.renderSidebar(); this.renderPage(); this.updateTopbar(); this.renderPreviewControls(); },
  updateTopbar() {
    document.getElementById('docName').textContent = this.displayName();
    document.getElementById('docPath').textContent = this.path ? '— ' + this.path : '';
    const bar = document.getElementById('topActions'); bar.innerHTML = '';
    const u = btn('Undo (Ctrl+Z)', 'undo', () => this.undo(), 'icon ghost'); u.disabled = !this.undoStack.length;
    const r = btn('Redo (Ctrl+Y)', 'redo', () => this.redo(), 'icon ghost'); r.disabled = !this.redoStack.length;
    bar.append(u, r, btn('Open Theme', 'open', () => this.openFileDialog()), btn('Export', 'export', () => this.go('export'), 'primary'));
  },
  isCustomized(id) {
    const f = this.theme.flags;
    switch (id) {
      case 'info': return !!this.name;
      case 'top': return f.topDrawType !== 0;
      case 'bottom': return f.bottomDrawType !== 0;
      case 'icons': return f.cursorColor || f.folderColor || f.folderTexture || f.fileColor || f.fileTexture;
      case 'buttons': return f.arrowButtonColor || f.arrowColor || f.openCloseColor || f.topCornerColor || f.bottomCornerColor;
      case 'folderView': return f.folderBackgroundColor || f.folderArrowColor;
      case 'text': return f.gameTextDrawType !== 0 || f.demoTextColor;
      case 'music': return f.backgroundMusic && !!this.bgm.data;
      case 'sounds': return f.soundEffects;
      default: return false;
    }
  },
  renderSidebar() {
    const nav = document.getElementById('sidebar'), keepX = nav.scrollLeft; nav.innerHTML = '';
    let group = null, g;
    for (const s of SECTIONS) {
      if (s.group !== group) { group = s.group; g = el('div', { class: 'nav-group' }, el('h6', {}, group)); nav.append(g); }
      g.append(el('div', { class: 'nav-item' + (this.section === s.id ? ' active' : ''), onclick: () => this.go(s.id) }, svg(s.icon), s.title, this.isCustomized(s.id) ? el('span', { class: 'badge', title: 'Customized' }) : null));
    }
    const foot = el('div', { class: 'sidebar-foot' }, this.iconCanvas || el('span'), el('div', {}, el('b', {}, this.displayName()), el('span', {}, this.author || 'No author')));
    nav.append(foot);
    nav.scrollLeft = keepX;
  },
  renderPage() {
    const ed = document.getElementById('editor'), top = ed.scrollTop;
    ed.innerHTML = '';
    ed.append(Pages[this.section]());
    ed.scrollTop = top;
  },
  renderPreviewControls() {
    const c = document.getElementById('previewControls'); c.innerHTML = '';
    c.append(
      segmented(Preview.MODES, this.previewMode, (v) => { this.previewMode = v; this.renderPreviewControls(); if (this.section === 'folderView') this.renderPage(); }),
      btn(this.animate ? 'Pause' : 'Play', this.animate ? 'pause' : 'play', () => { this.animate = !this.animate; this.renderPreviewControls(); }, 'small'),
      btn('Save preview.png', 'image', () => this.savePreview(), 'small ghost'),
    );
  },
  startPreviewLoop() {
    const top = document.getElementById('topCanvas'), bot = document.getElementById('bottomCanvas'), pane = document.getElementById('preview'), shell = document.getElementById('console');
    Preview.mountShell(shell);
    let frozen = 0;
    const frame = (ts) => {
      const dpr = window.devicePixelRatio || 1;
      const mob = window.innerWidth <= 860, padX = mob ? 16 : 40, padY = mob ? 64 : 120;
      const fits = (c) => { const [w, h] = Preview.shellSize(c); return Math.min((pane.clientWidth - padX) / w, (pane.clientHeight - padY) / h); };
      const compact = mob || fits(false) < 0.62, scale = Math.max(mob ? 0.2 : 0.45, Math.min(2.2, fits(compact)));
      if (compact !== shell.classList.contains('compact')) shell.classList.toggle('compact', compact);
      if (shell.style.getPropertyValue('--s') !== String(scale)) shell.style.setProperty('--s', String(scale));
      for (const [cv, w] of [[top, 412], [bot, 320]]) {
        const W = Math.round(w * scale * dpr), H = Math.round(240 * scale * dpr);
        if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; cv.style.width = W / dpr + 'px'; cv.style.height = H / dpr + 'px'; }
      }
      const time = this.animate ? ts / 1000 : frozen; if (this.animate) frozen = time;
      const s = { ...this.previewState(), time };
      let ctx = top.getContext('2d'); ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0); Preview.drawTop(ctx, s);
      ctx = bot.getContext('2d'); ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0); Preview.drawBottom(ctx, s);
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  },
  async init() {
    this.defaultPatternCanvas = Imaging.imageToCanvas(TK.DEFAULT_PATTERN, true);
    this.iconCanvas = Imaging.imageToCanvas(this.icon);
    this.lastSnap = this.snapshot();
    window.api.onMenu((a) => this.menu(a));
    window.api.onSendProgress((p) => Busy.progress(p));
    // Drop a theme anywhere to open it
    document.addEventListener('dragover', (e) => e.preventDefault());
    document.addEventListener('drop', async (e) => {
      e.preventDefault(); const f = e.dataTransfer.files[0]; if (!f) return;
      const p = await window.api.importFile(f);
      if (window.api.isDir(p) || /\.(zip|bin)$/i.test(p)) { if (await this.confirmDiscard()) this.open(p); }
    });
    this.renderAll();
    this.startPreviewLoop();
  },
  async menu(a) {
    switch (a) {
      case 'new': if (await this.confirmDiscard()) this.reset(); break;
      case 'open-folder': this.openFolderDialog(); break;
      case 'open-file': this.openFileDialog(); break;
      case 'export-folder': this.exportFolder(); break;
      case 'export-zip': this.exportZip(); break;
      case 'save-preview': this.savePreview(); break;
      case 'export-preset': this.exportPreset(); break;
      case 'import-preset': this.importPreset(); break;
      case 'undo': this.undo(); break;
      case 'redo': this.redo(); break;
      case 'toggle-animation': this.animate = !this.animate; this.renderPreviewControls(); break;
      case 'toggle-folder': this.folderMode = !this.folderMode; this.renderPreviewControls(); break;
      case 'about': window.api.about(); break;
      case 'request-close': if (await this.confirmDiscard()) window.api.closeWindow(); break;
    }
  },
};

<script>
// Builds each editor page.
const IMG_FILTERS = [{ name: 'Pictures', extensions: ['png', 'jpg', 'jpeg', 'gif', 'bmp', 'webp', 'tif', 'tiff'] }];
const AUDIO_FILTERS = [{ name: 'Audio', extensions: ['mp3', 'wav', 'm4a', 'aac', 'ogg', 'oga', 'flac', 'opus', 'webm', 'aif', 'aiff', 'bcstm'] }];
const SFX_FILTERS = [{ name: 'Audio', extensions: ['mp3', 'wav', 'm4a', 'aac', 'ogg', 'flac', 'opus', 'bcwav'] }];
const FIT_OPTIONS = [['fill', 'Fill (crop edges)'], ['fit', 'Fit (letterbox)'], ['stretch', 'Stretch']];

function sec(id) { return SECTIONS.find((s) => s.id === id); }
function page(...children) { return el('div', { class: 'page' }, ...children); }
const F = () => App.theme.flags, C = () => App.theme.colors;

/** Picture slot with thumbnail, drop target, Edit/Replace/Remove. */
function imageSlot(slot, title, detail, height = 130) {
  const f = F(), [vw, vh] = TK.Geometry.visible(slot, f), [cw, ch] = TK.Geometry.canvas(slot, f);
  const src = App.sources[slot], img = App.images[slot];
  const thumb = el('div', { class: 'thumb' + (img ? ' has' : ''), style: { height: height + 'px' } });
  if (img) {
    const c = document.createElement('canvas'); c.width = Math.min(vw, img.width); c.height = Math.min(vh, img.height);
    const x = c.getContext('2d');
    if (TK.SLOTS[slot] === 'a8') { x.fillStyle = '#000'; x.fillRect(0, 0, c.width, c.height); }
    x.drawImage(img, 0, 0);
    if (c.width < 140) c.classList.add('px');
    Object.assign(c.style, { position: 'absolute', inset: '4px', width: 'calc(100% - 8px)', height: 'calc(100% - 8px)', objectFit: 'contain' });
    thumb.append(c, el('div', { class: 'hover' }, src ? 'Click to edit' : ''));
  } else {
    thumb.append(el('div', { class: 'empty' }, svg('imagePlus'), 'Drop any picture here — it\'s resized automatically'));
  }
  const choose = async () => { const p = await window.api.openFile(`Choose a picture for ${title}`, IMG_FILTERS); if (p) App.loadPicture(slot, p); };
  thumb.addEventListener('click', () => (src ? Editor.open(slot, title) : choose()));
  fileDrop(thumb, (p) => App.loadPicture(slot, p));
  const controls = el('div', { class: 'row wrap' },
    btn(src ? 'Replace…' : 'Choose…', 'open', choose, 'small'),
    src ? btn('Edit…', 'sliders', () => Editor.open(slot, title), 'small') : null,
    src ? selectBox(FIT_OPTIONS, src.edit.fit, (v) => { src.edit.fit = v; App.renderSlot(slot); App.renderPage(); }) : null,
    el('div', { class: 'grow' }),
    src || img ? btn('Remove', 'trash', () => App.clearPicture(slot), 'small danger') : null);
  if (controls.querySelector('select')) Object.assign(controls.querySelector('select').style, { width: '150px', padding: '5px 26px 5px 8px', fontSize: '12px' });
  return el('div', { style: { display: 'flex', flexDirection: 'column', gap: '10px' } },
    el('div', { class: 'slot-head' }, el('div', { class: 't' }, el('b', {}, title), el('small', {}, detail)),
      el('span', { class: 'pill' }, vw === cw && vh === ch ? `${cw} × ${ch}` : `${vw} × ${vh} visible`)),
    thumb, controls);
}

const Pages = {
  paletteCard() {
    if (!App.palette.length) return el('div', { class: 'palette-host' });
    return el('div', { class: 'palette-host' }, card(
      cardHead('Wallpaper Palette', 'palette', 'Drag a swatch onto any color below. Click to copy its hex code.'),
      el('div', { class: 'palette' }, ...App.palette.map((c) => {
        const d = el('div', { draggable: 'true', title: rgbHex(c), style: { background: rgbHex(c) } });
        d.addEventListener('dragstart', (e) => e.dataTransfer.setData('text/x-mtm3-color', rgbHex(c)));
        d.addEventListener('click', () => { navigator.clipboard.writeText(rgbHex(c)); toast('Copied ' + rgbHex(c)); });
        return d;
      }))));
  },

  info() {
    const field = (label, limit, value, set, multiline, placeholder, help) => {
      const count = el('span', {}, `${value.length}/${limit}`);
      const input = multiline ? el('textarea', { maxlength: limit, placeholder }) : el('input', { type: 'text', maxlength: limit, placeholder });
      input.value = value;
      input.addEventListener('input', () => { set(input.value); count.textContent = `${input.value.length}/${limit}`; App.setDirty(true); App.updateTopbar(); App.renderSidebar(); });
      return el('div', { class: 'field' }, el('label', {}, label, count), input, el('small', {}, help));
    };
    const iconCv = document.createElement('canvas'); iconCv.width = 48; iconCv.height = 48;
    if (App.iconCanvas) iconCv.getContext('2d').drawImage(App.iconCanvas, 0, 0);
    Object.assign(iconCv.style, { width: '96px', height: '96px', imageRendering: 'pixelated', borderRadius: '14px' });
    const iconBox = el('div', { class: 'thumb has', style: { width: '100px', height: '100px', flex: 'none' } }, iconCv);
    const pickIcon = async () => { const p = await window.api.openFile('Choose a theme icon', IMG_FILTERS); if (p) App.setIcon(await Imaging.loadPath(p)); };
    iconBox.addEventListener('click', pickIcon);
    fileDrop(iconBox, async (p) => App.setIcon(await Imaging.loadPath(p)));
    return page(
      pageHead(sec('info'), 'The name, description and icon shown in theme managers like Anemone3DS and on ThemePlaza. Saved in info.smdh automatically.'),
      card(cardHead('Details', 'text'),
        field('Theme Name', 64, App.name, (v) => { App.name = v; }, false, 'My Awesome Theme', 'Up to 64 characters.'),
        field('Description', 128, App.description, (v) => { App.description = v; }, true, 'A short description of your theme', 'Up to 128 characters.'),
        field('Author', 64, App.author, (v) => { App.author = v; }, false, 'Your name', 'Your name or username.')),
      card(cardHead('Theme Icon', 'image', '48 × 48 pixels. The 24 × 24 version is made automatically.'),
        el('div', { class: 'row', style: { gap: '18px' } }, iconBox,

function waveform(pcm) {

      let peak = 0; const st = b * per; for (let i = st; i < Math.min(ch.length, st + per); i += Math.max(1, per >> 6)) peak = Math.max(peak, Math.abs(ch[i]));

  });

}

<script>
// Full-screen picture editor: position, resize, rotate, flip and color-correct, previewed in real 3DS colors.
const Editor = {
  state: null,
  open(slot, title) {
    const src = App.sources[slot]; if (!src) return;
    this.state = { slot, title, edit: structuredClone(src.edit), original: structuredClone(src.edit), consoleColors: true, guides: true };
    this.build();
  },
  close(apply) {
    const s = this.state; if (!s) return;
    App.sources[s.slot].edit = apply ? s.edit : s.original;
    App.renderSlot(s.slot);
    this.node.remove(); this.node = null; this.state = null;
    document.removeEventListener('keydown', this.keyHandler);
    App.renderPage();
  },
  commitSoon() {
    clearTimeout(this.commitTimer);
    this.commitTimer = setTimeout(() => { if (!this.state) return; App.sources[this.state.slot].edit = structuredClone(this.state.edit); App.renderSlot(this.state.slot); }, 200);
  },
  build() {
    const s = this.state, e = s.edit, [vw, vh] = TK.Geometry.visible(s.slot, App.theme.flags);
    const fmt = TK.SLOTS[s.slot];
    const stage = el('div', { class: 'stage' });
    const view = document.createElement('canvas'); view.width = vw; view.height = vh;
    const guides = document.createElement('canvas'); guides.className = 'guides'; guides.width = vw * 2; guides.height = vh * 2;
    const frame = el('div', { class: 'frame' }, view, guides);
    const hint = el('div', { class: 'hint' });
    stage.append(frame, hint);

    const layout = () => {
      const r = stage.getBoundingClientRect();
      const pad = r.width < 600 ? 16 : 60; const scale = Math.min((r.width - pad) / vw, (r.height - (r.width < 600 ? 50 : 90)) / vh, fmt === 'rgb565' ? 3 : 6);
      Object.assign(view.style, { width: vw * scale + 'px', height: vh * scale + 'px', imageRendering: scale >= 2 ? 'pixelated' : 'auto' });
      Object.assign(guides.style, { width: vw * scale + 'px', height: vh * scale + 'px' });
      s.scale = scale;
    };
    const redraw = () => {
      const img = App.renderSlotImage(s.slot, e);
      const shown = s.consoleColors ? Imaging.consolePreview(img, fmt, App.theme.ditherBackgrounds) : img;
      view.getContext('2d').drawImage(Imaging.imageToCanvas(shown), 0, 0);
      this.drawGuides(guides, s.slot, s.guides);
      hint.textContent = `Drag to move · ${matchMedia('(pointer: coarse)').matches ? 'Pinch' : 'Scroll'} to zoom · ${vw} × ${vh} px${s.consoleColors ? ' · showing real 3DS colors' : ''}`;
    };
    const update = () => { redraw(); this.commitSoon(); };
    this.update = update;

    // Drag to move, wheel to zoom
    let drag = null;
    // Pointer events so this works with a mouse, a pen or fingers (one finger drags, two fingers pinch to zoom)
    const pts = new Map(); let pinch = null;
    frame.style.touchAction = 'none';
    const pinchInfo = () => { const [a, b] = [...pts.values()]; return { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, zoom: e.zoom }; };
    frame.addEventListener('pointerdown', (ev) => {
      frame.setPointerCapture(ev.pointerId); pts.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
      if (pts.size === 1) { drag = { x: ev.clientX, y: ev.clientY, ox: e.offsetX, oy: e.offsetY }; frame.classList.add('grabbing'); }
      else if (pts.size === 2) { drag = null; pinch = pinchInfo(); }
    });
    frame.addEventListener('pointermove', (ev) => {
      if (!pts.has(ev.pointerId) || !this.state) return; pts.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
      if (pinch && pts.size >= 2) { const now = pinchInfo(); e.zoom = Math.min(4, Math.max(0.1, pinch.zoom * now.d / pinch.d)); syncSliders(); update(); return; }
      if (!drag) return; e.offsetX = Math.round(drag.ox + (ev.clientX - drag.x) / s.scale); e.offsetY = Math.round(drag.oy + (ev.clientY - drag.y) / s.scale); syncSliders(); update();
    });
    const endPtr = (ev) => {
      pts.delete(ev.pointerId); if (pts.size < 2) pinch = null;
      if (pts.size === 1) { const [p] = [...pts.values()]; drag = { x: p.x, y: p.y, ox: e.offsetX, oy: e.offsetY }; }
      if (pts.size === 0) { drag = null; frame.classList.remove('grabbing'); }
    };
